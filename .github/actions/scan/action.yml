name: "mcp-sec-scan"
description: "Run mcp-sec-scan against a remote MCP server and fail the build on findings."
inputs:
  url:
    description: "MCP server URL (Streamable HTTP)"
    required: true
  token:
    description: "Bearer token for authenticated deep checks"
    required: false
    default: ""
  active:
    description: "Enable active probes (rate-limit burst)"
    required: false
    default: "false"
  ci:
    description: "Fail build on findings (exit 2 on PROBLEM, 1 on WARN)"
    required: false
    default: "true"
  report:
    description: "Path for the Markdown report artifact"
    required: false
    default: "mcp-sec-scan-report.md"
  sarif:
    description: "Path for a SARIF 2.1.0 report (upload to the Security tab). Empty = skip."
    required: false
    default: "mcp-sec-scan.sarif"
runs:
  using: "composite"
  steps:
    # The scanner is built from this action's own repository checkout, not fetched from a
    # package registry. A registry install would let whoever controls that package name run
    # code in every consumer's CI — with the bearer token below in the same environment.
    - name: Build mcp-sec-scan from source
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        REPO_ROOT="$(cd "$ACTION_PATH/../../.." && pwd)"
        echo "MCP_SEC_SCAN_ROOT=$REPO_ROOT" >> "$GITHUB_ENV"
        cd "$REPO_ROOT"
        npm ci --ignore-scripts
        npm run build

    # Every input is passed through the environment and dereferenced as a shell variable.
    # Interpolating ${{ inputs.* }} directly into the script would splice attacker-controlled
    # text into the command line before bash ever sees it.
    - name: Run mcp-sec-scan
      shell: bash
      env:
        MCP_SEC_SCAN_TOKEN: ${{ inputs.token }}
        IN_URL: ${{ inputs.url }}
        IN_REPORT: ${{ inputs.report }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_ACTIVE: ${{ inputs.active }}
        IN_CI: ${{ inputs.ci }}
      run: |
        set -uo pipefail
        args=("$IN_URL" -m "$IN_REPORT")
        if [ -n "$IN_SARIF" ]; then args+=(--sarif "$IN_SARIF"); fi
        if [ "$IN_ACTIVE" = "true" ]; then args+=(--active); fi
        if [ "$IN_CI" = "true" ]; then args+=(--ci); fi
        # No 'set -e': with --ci the scanner exits 1/2 on findings, and that exit code is the
        # result this step is supposed to report.
        node "$MCP_SEC_SCAN_ROOT/dist/cli.js" "${args[@]}"
